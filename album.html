      // Scales the image map coordinates to match the banner's displayed size
      function scaleImageMaps() {
        document.querySelectorAll('img[usemap]').forEach(function (img) {
          const mapName = img.getAttribute('usemap').replace('#', '');
          const map = document.querySelector('map[name="' + mapName + '"]');
          if (!map || !img.naturalWidth || !img.clientWidth) return;

          const scale = img.clientWidth / img.naturalWidth;

          map.querySelectorAll('area').forEach(function (area) {
            // Save the original coordinates once, so repeated resizes don't compound
            if (!area.dataset.original) {
              area.dataset.original = area.getAttribute('coords');
            }
            const scaled = area.dataset.original
              .split(',')
              .map(function (n) { return Math.round(parseFloat(n) * scale); })
              .join(',');
            area.setAttribute('coords', scaled);
          });
        });
      }

      window.addEventListener('load', scaleImageMaps);
      window.addEventListener('resize', scaleImageMaps);
      // Re-scale the map when a dropdown opens, since hidden images have no width
      document.addEventListener('toggle', scaleImageMaps, true);
    </script>
